name: Build APKs (User + Admin)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- USER APK (players) ----------
      - name: Build web app (user)
        run: npm run build

      - name: Sync Capacitor (user)
        run: npx cap sync android

      - name: Build user APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename user APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk KheloFire-user.apk

      # ---------- ADMIN APK (opens straight at /admin) ----------
      - name: Build web app (admin)
        run: VITE_ADMIN_BUILD=true npm run build

      - name: Sync Capacitor (admin)
        run: npx cap sync android

      - name: Rebrand to KheloFire Admin (launcher name + separate package id)
        run: |
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">KheloFire Admin</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|applicationId "[^"]*"|applicationId "com.khelofire.app.admin"|' android/app/build.gradle

      - name: Build admin APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename admin APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk KheloFire-admin.apk

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: KheloFire-APKs
          path: |
            KheloFire-user.apk
            KheloFire-admin.apk
          if-no-files-found: error
